    <circle cx="165" cy="140" r="78" fill="none" stroke="#111" stroke-width="20"/>
    <rect x="100" y="118" width="130" height="55" rx="26" fill="#111"/>
    <circle cx="136" cy="146" r="9" fill="#fff"/>
    <circle cx="194" cy="146" r="9" fill="#fff"/>
    <line x1="120" y1="79" x2="92" y2="39" stroke="#111" stroke-width="14" stroke-linecap="round"/>
    <line x1="210" y1="79" x2="238" y2="39" stroke="#111" stroke-width="14" stroke-linecap="round"/>
