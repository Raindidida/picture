    <text x="0" y="426" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#555">World model / humanoid motion cue.</text>
  </g>
  <g transform="translate(80 760)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#111">Design rules extracted</text>
    <text x="0" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#333">1. Pure mark first. 2. Black/white only. 3. Use O as open system, not Roboto-font wordmark. 4. One memorable cut, not decorative complexity.</text>
