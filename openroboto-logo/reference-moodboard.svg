<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f6f6f3"/>
  <text x="80" y="95" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#111">OpenRoboto logo reference board</text>
  <text x="80" y="138" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#555">From Pinterest/search direction: keep the O, open frame, robotics authority; avoid mascot heads, crypto grids, neon AI gradients.</text>
  <g transform="translate(80 210)">
    <rect width="330" height="330" rx="18" fill="#fff" stroke="#ddd"/>
