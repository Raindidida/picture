    <path d="M166 61 L250 110 L198 110 L166 92 Z" fill="#f6f6f3"/>
    <text x="0" y="390" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#111">Open robotics geometry</text>
    <text x="0" y="426" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#555">Strong negative space, modular shape.</text>
  </g>
  <g transform="translate(455 210)">
